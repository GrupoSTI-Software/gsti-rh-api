      tags: [DocumentosContratoEspecializado]
      security:
        - bearerAuth: []
      parameters:
        - name: contratoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Listado cronológico descendente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentosContratoListSuccess'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso read o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: key contrato-no-encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      summary: Subir documento firmado del contrato
      tags: [DocumentosContratoEspecializado]
      security:
        - bearerAuth: []
      parameters:
        - name: contratoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - archivo
                - fechaInicioVigencia
                - fechaVencimiento
              properties:
                archivo:
                  type: string
                  format: binary
                  description: PDF (tamaño máx. según MAX_FILE_BYTES del servicio de documentos)
                fechaInicioVigencia:
                  type: string
                  format: date
                fechaVencimiento:
                  type: string
                  format: date
      responses:
        '201':
          description: Documento creado (origen subido, vigente true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoContratoEspecializadoSuccess'
        '400':
          description: key vigencia-incoherente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso create o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: key contrato-no-encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: key documento-invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

