openapi: 3.0.3
info:
  title: Valanserh API - Compliance REPSE
  version: 1.3.0
  description: Empresas contratantes, contratos de servicios especializados con anexo 15-D LFT, documentos firmados, asignación de trabajadores y sucursales como sitios de servicio REPSE.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmpresaContratante:
      type: object
      properties:
        id:
          type: integer
        razonSocial:
          type: string
          minLength: 3
          maxLength: 255
        rfc:
          type: string
          minLength: 12
          maxLength: 13
        domicilioFiscal:
          type: string
          minLength: 10
          maxLength: 500
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    EmpresaContratanteCreate:
      type: object
      required:
        - businessUnitId
        - razonSocial
        - rfc
        - domicilioFiscal
      properties:
        businessUnitId:
          type: integer
          description: Empresa prestadora (extensión vs HU; requerido en API).
        razonSocial:
          type: string
        rfc:
          type: string
        domicilioFiscal:
          type: string
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    EmpresaContratanteUpdate:
      type: object
      properties:
        razonSocial:
          type: string
        rfc:
          type: string
        domicilioFiscal:
          type: string
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        currentPage:
          type: integer
        perPage:
          type: integer
        lastPage:
          type: integer

    ApiError:
      type: object
      properties:
        type:
          type: string
          enum: [error]
        title:
          type: string
        message:
          type: string
        detail:
          type: string
        key:
          type: string
        errorCode:
          type: string
        data:
          nullable: true

    ServicioRegistradoResumen:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          description: Identificador del servicio en el catálogo REPSE del tenant.
        name:
          type: string
          description: Nombre del servicio especializado registrado.

    ApiErrorServiciosRegistradosRequeridos:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Servicios registrados requeridos
        message: Debe indicar al menos un servicio del catálogo REPSE registrado.
        detail: Debe indicar al menos un servicio del catálogo REPSE.
        key: servicios-registrados-requeridos
        errorCode: CSE.VAL.SERVICIOS.001
        data: null

    ApiErrorServicioRegistradoNoEncontrado:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Servicio registrado no encontrado
        message: Uno o más servicios registrados no existen o no pertenecen al tenant actual.
        detail: Servicio registrado no encontrado.
        key: servicio-registrado-no-encontrado
        errorCode: CSE.NF.SERVICIO.001
        data: null

    ApiErrorServicioConContratosActivos:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Servicio con contratos asociados
        message: No se puede eliminar el servicio mientras esté vinculado a contratos activos.
        detail: Servicio con contratos activos
        key: servicio-con-contratos-activos
        errorCode: REPSE.SVC.CONFLICT.CONTRATOS.001
        data: null

    RepseSpecializedServiceResource:
      type: object
      properties:
        repseSpecializedServiceId:
          type: integer
        repseRegistrationId:
          type: integer
        name:
          type: string
        objectDescription:
          type: string
        status:
          type: string
          enum: [active]
        repseSpecializedServiceCreatedAt:
          type: string
          format: date-time
          nullable: true
        repseSpecializedServiceUpdatedAt:
          type: string
          format: date-time
          nullable: true

    RepseSpecializedServiceDeleteSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            repseSpecializedService:
              $ref: '#/components/schemas/RepseSpecializedServiceResource'

    EmpresasContratantesListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            empresasContratantes:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/EmpresaContratante'

    EmpresaContratanteSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            empresaContratante:
              $ref: '#/components/schemas/EmpresaContratante'

    EmpresaContratanteEmbed:
      type: object
      required: [empresaContratanteId, razonSocial]
      properties:
        empresaContratanteId:
          type: integer
        razonSocial:
          type: string

    BranchOffice:
      type: object
      properties:
        branchOfficeId:
          type: integer
        businessUnitId:
          type: integer
        branchOfficeName:
          type: string
        branchOfficeSlug:
          type: string
        branchOfficeLocationAddress:
          type: string
          nullable: true
        branchOfficeIdealTemplateCount:
          type: integer
          nullable: true
        branchOfficeMinActiveEmployeesPerShift:
          type: integer
          nullable: true
        empresaContratanteId:
          type: integer
          nullable: true
        empresaContratante:
          allOf:
            - $ref: '#/components/schemas/EmpresaContratanteEmbed'
          nullable: true
        branchOfficeCreatedAt:
          type: string
          format: date-time
          nullable: true
        branchOfficeUpdatedAt:
          type: string
          format: date-time
          nullable: true
        branchOfficeDeletedAt:
          type: string
          format: date-time
          nullable: true

    BranchOfficeCreate:
      type: object
      required: [businessUnitId, branchOfficeName]
      properties:
        businessUnitId:
          type: integer
        branchOfficeName:
          type: string
          maxLength: 255
        branchOfficeLocationAddress:
          type: string
          nullable: true
        branchOfficeIdealTemplateCount:
          type: integer
          minimum: 0
          nullable: true
        branchOfficeMinActiveEmployeesPerShift:
          type: integer
          minimum: 0
          nullable: true
        empresaContratanteId:
          type: integer
          nullable: true

    BranchOfficeUpdate:
      type: object
      properties:
        businessUnitId:
          type: integer
        branchOfficeName:
          type: string
        branchOfficeLocationAddress:
          type: string
          nullable: true
        branchOfficeIdealTemplateCount:
          type: integer
          nullable: true
        branchOfficeMinActiveEmployeesPerShift:
          type: integer
          nullable: true
        empresaContratanteId:
          type: integer
          nullable: true

    BranchOfficeSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            branchOffice:
              $ref: '#/components/schemas/BranchOffice'

    BranchOfficesListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            branchOffices:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/BranchOffice'

    ApiErrorEmpresaContratanteNoEncontrada:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Empresa contratante no encontrada
        message: No se encontró la empresa contratante indicada
        detail: No se encontró la empresa contratante indicada
        key: empresa-contratante-no-encontrada
        errorCode: ECNT.NF.001
        data: null

    ApiErrorSucursalYaLigada:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Sucursal ya ligada
        message: La sucursal ya está ligada a otra empresa contratante.
        detail: La sucursal ya está ligada a otra empresa contratante.
        key: sucursal-ya-ligada
        errorCode: BRCH.CONFLICT.LINK.001
        data: null

    BranchOfficeShiftQuotaShiftRef:
      type: object
      required: [shiftId, shiftName]
      properties:
        shiftId:
          type: integer
        shiftName:
          type: string

    BranchOfficeShiftQuotaItem:
      type: object
      required: [branchOfficeShiftQuotaId, shift, required, minimum]
      properties:
        branchOfficeShiftQuotaId:
          type: integer
        shift:
          $ref: '#/components/schemas/BranchOfficeShiftQuotaShiftRef'
        required:
          type: integer
          minimum: 1
          description: Plantilla requerida para operación normal
        minimum:
          type: integer
          minimum: 1
          description: Mínimo crítico tolerable

    BranchOfficeShiftQuotaInputItem:
      type: object
      required: [shiftId, required, minimum]
      properties:
        shiftId:
          type: integer
          minimum: 1
        required:
          type: integer
          minimum: 1
        minimum:
          type: integer
          minimum: 1

    BranchOfficeShiftQuotasReplace:
      type: object
      properties:
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/BranchOfficeShiftQuotaInputItem'

    BranchOfficeShiftQuotasSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          required: [quotas]
          properties:
            quotas:
              type: array
              items:
                $ref: '#/components/schemas/BranchOfficeShiftQuotaItem'
      example:
        type: success
        title: Branch Office Shift Quotas
        message: Cuotas guardadas correctamente
        data:
          quotas:
            - branchOfficeShiftQuotaId: 1
              shift:
                shiftId: 3
                shiftName: Nocturno
              required: 3
              minimum: 3

    ApiErrorSucursalNoEncontradaShiftQuotas:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Sucursal no encontrada
        message: Sucursal no encontrada o no disponible para esta instancia del sistema
        detail: Sucursal no encontrada o no disponible para esta instancia del sistema
        key: sucursal-no-encontrada
        errorCode: BRCH.SQ.NF.BRCH.001
        data: null

    ApiErrorTurnoNoEncontradoShiftQuotas:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Turno no encontrado
        message: No se encontró el turno del item 1 (id 99999) para esta unidad
        detail: No se encontró el turno del item 1 (id 99999) para esta unidad
        key: turno-no-encontrado
        errorCode: BRCH.SQ.NF.SHIFT.001
        data: null

    ApiErrorCuotaInvalida:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Cuota inválida
        message: "El item 1 (turno 3): el mínimo no puede superar la plantilla requerida y ambos deben ser al menos 1"
        detail: "El item 1 (turno 3): el mínimo no puede superar la plantilla requerida y ambos deben ser al menos 1"
        key: cuota-invalida
        errorCode: BRCH.SQ.VAL.QUOTA.001
        data: null

    ApiErrorShiftIdDuplicadoShiftQuotas:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Turno repetido en el lote
        message: "shiftId repetido en los items: 1, 2"
        detail: "Los items 1, 2 repiten el mismo shiftId"
        errorCode: BRCH.SQ.VAL.DUP.001
        data: null

    ApiErrorEmpresaConSitiosLigados:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Empresa con sitios de servicio
        message: Desliga las 2 sucursales ligadas antes de eliminar la empresa
        detail: Desliga las 2 sucursales ligadas antes de eliminar la empresa
        key: empresa-con-sitios-ligados
        errorCode: ECNT.CONFLICT.SITIOS.001
        data: null

    ContratosServiciosEspecializadosListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            contratosServiciosEspecializados:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContratoServicioEspecializado'
      example:
        type: success
        title: Contratos de Servicios Especializados
        message: Contratos obtenidos correctamente
        data:
          contratosServiciosEspecializados:
            meta:
              total: 1
              page: 1
              currentPage: 1
              perPage: 20
              lastPage: 1
            data:
              - id: 42
                numeroContrato: CSE-2026-001
                empresaContratante:
                  id: 1
                  razonSocial: Manufacturas del Norte SA de CV
                  rfc: DMN900101AA1
                fechaInicio: '2026-01-15'
                fechaFin: '2026-03-31'
                objetoServicio: Prestación de servicios especializados de limpieza industrial.
                montoTotal: 450000
                moneda: MXN
                estatus: vencido
                vencidoPorFecha: true
                anexo15d:
                  folioRepse: REPSE-2026-001
                  objetoDetallado: Limpieza profunda de áreas productivas.
                  numeroTrabajadoresAprox: 12
                  fechaInicioServicio: '2026-01-15'
                  fechaFinServicio: '2026-12-31'
                  compromisosDocumentales: []
                  responsabilidadSolidariaAceptada: true
                  textoResponsabilidadSolidaria: Texto de responsabilidad solidaria conforme al artículo 15-D LFT.
                createdAt: '2026-01-15T12:00:00.000Z'
                updatedAt: '2026-01-15T12:00:00.000Z'

    ContratoServicioEspecializadoSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            contratoServicioEspecializado:
              $ref: '#/components/schemas/ContratoServicioEspecializado'
      example:
        type: success
        title: Contrato de Servicios Especializados
        message: Contrato encontrado correctamente
        data:
          contratoServicioEspecializado:
            id: 42
            numeroContrato: CSE-2026-001
            empresaContratante:
              id: 1
              razonSocial: Manufacturas del Norte SA de CV
              rfc: DMN900101AA1
            fechaInicio: '2026-01-15'
            fechaFin: '2026-03-31'
            objetoServicio: Prestación de servicios especializados de limpieza industrial.
            montoTotal: 450000
            moneda: MXN
            estatus: vencido
            vencidoPorFecha: true
            anexo15d:
              folioRepse: REPSE-2026-001
              objetoDetallado: Limpieza profunda de áreas productivas.
              numeroTrabajadoresAprox: 12
              fechaInicioServicio: '2026-01-15'
              fechaFinServicio: '2026-12-31'
              compromisosDocumentales: []
              responsabilidadSolidariaAceptada: true
              textoResponsabilidadSolidaria: Texto de responsabilidad solidaria conforme al artículo 15-D LFT.
            createdAt: '2026-01-15T12:00:00.000Z'
            updatedAt: '2026-01-15T12:00:00.000Z'

    RenovarContratoRequest:
      type: object
      required: [fechaInicio, fechaFin, motivo]
      properties:
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        motivo:
          type: string
          minLength: 3
          maxLength: 500

    AddendumAnexo15DRequest:
      type: object
      description: |
        Subconjunto addendable del anexo 15-D. Debe incluir al menos un campo.
        folioRepse no se acepta (server-side).
      properties:
        numeroTrabajadoresAprox:
          type: integer
          minimum: 1
        objetoDetallado:
          type: string
          minLength: 20
          maxLength: 3000
        fechaInicioServicio:
          type: string
          format: date
        fechaFinServicio:
          type: string
          format: date
          nullable: true
        compromisosDocumentales:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompromisoDocumental'
        responsabilidadSolidariaAceptada:
          type: boolean
        textoResponsabilidadSolidaria:
          type: string
          minLength: 50
          maxLength: 3000

    AddendumContratoRequest:
      type: object
      required: [motivo, anexo]
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 500
        anexo:
          $ref: '#/components/schemas/AddendumAnexo15DRequest'

    VersionContratoSnapshot:
      type: object
      properties:
        fechaInicio:
          type: string
          format: date
          nullable: true
        fechaFin:
          type: string
          format: date
          nullable: true
        anexo15d:
          $ref: '#/components/schemas/Anexo15D'
        documentoVigenteId:
          type: integer
          nullable: true

    VersionContratoEspecializado:
      type: object
      properties:
        numeroVersion:
          type: integer
        tipoCambio:
          type: string
          enum: [renovacion, addendum]
        motivo:
          type: string
        fechaCambio:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/VersionContratoSnapshot'
        creadoPor:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    RenovacionContratoData:
      type: object
      properties:
        contrato:
          $ref: '#/components/schemas/ContratoServicioEspecializado'
        version:
          $ref: '#/components/schemas/VersionContratoEspecializado'

    RenovacionContratoSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/RenovacionContratoData'
      example:
        type: success
        title: Versión de contrato
        message: Contrato renovado correctamente
        data:
          contrato:
            id: 42
            numeroContrato: CSE-2026-001
            fechaInicio: '2026-04-01'
            fechaFin: '2027-03-31'
            estatus: vigente
            vencidoPorFecha: false
          version:
            numeroVersion: 1
            tipoCambio: renovacion
            motivo: Renovación anual conforme al calendario fiscal
            fechaCambio: '2026-04-01T10:00:00.000Z'
            snapshot:
              fechaInicio: '2026-01-15'
              fechaFin: '2026-03-31'
              anexo15d:
                folioRepse: REPSE-2026-001
                objetoDetallado: Limpieza profunda de áreas productivas.
              documentoVigenteId: 7
            creadoPor: 1
            createdAt: '2026-04-01T10:00:00.000Z'

    AddendumContratoData:
      type: object
      properties:
        anexo15d:
          $ref: '#/components/schemas/Anexo15D'
        version:
          $ref: '#/components/schemas/VersionContratoEspecializado'

    AddendumContratoSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/AddendumContratoData'
      example:
        type: success
        title: Versión de contrato
        message: Addendum registrado correctamente
        data:
          anexo15d:
            folioRepse: REPSE-2026-001
            objetoDetallado: Mantenimiento industrial con ampliación de personal.
            numeroTrabajadoresAprox: 25
            fechaInicioServicio: '2026-01-15'
            fechaFinServicio: '2026-12-31'
            compromisosDocumentales: []
            responsabilidadSolidariaAceptada: true
            textoResponsabilidadSolidaria: Texto de responsabilidad solidaria conforme al artículo 15-D LFT.
          version:
            numeroVersion: 2
            tipoCambio: addendum
            motivo: Ampliación de personal por incremento de operación
            fechaCambio: '2026-06-09T10:00:00.000Z'
            snapshot:
              fechaInicio: '2026-01-15'
              fechaFin: '2026-12-31'
              anexo15d:
                folioRepse: REPSE-2026-001
                objetoDetallado: Mantenimiento industrial.
                numeroTrabajadoresAprox: 15
              documentoVigenteId: 7
            creadoPor: 1
            createdAt: '2026-06-09T10:00:00.000Z'

    VersionesContratoListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionContratoEspecializado'

    VersionContratoEspecializadoSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/VersionContratoEspecializado'

    AsignacionContratoAdvertencia:
      type: object
      required: [key, detail]
      properties:
        key:
          type: string
          example: porcentaje-dedicacion-excedido
        detail:
          type: string
          example: El empleado suma 120.00% de dedicación en contratos vigentes solapados

    AsignacionContratoEmpleado:
      type: object
      required: [id, nombre, nss]
      properties:
        id:
          type: integer
        nombre:
          type: string
        nss:
          type: string
          nullable: true

    AsignacionContratoEspecializadoListItem:
      type: object
      required:
        - id
        - contratoServicioEspecializadoId
        - empleado
        - fechaInicio
        - fechaFin
        - porcentajeTiempo
      properties:
        id:
          type: integer
        contratoServicioEspecializadoId:
          type: integer
        empleado:
          $ref: '#/components/schemas/AsignacionContratoEmpleado'
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
        porcentajeTiempo:
          type: string
          example: '100.00'

    AsignacionContratoEspecializadoResource:
      allOf:
        - $ref: '#/components/schemas/AsignacionContratoEspecializadoListItem'
        - type: object
          required: [advertencias]
          properties:
            advertencias:
              type: array
              items:
                $ref: '#/components/schemas/AsignacionContratoAdvertencia'

