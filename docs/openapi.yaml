paths:
  /api/billing/subscription/change-preview:
    get:
      summary: Previsualizar cambio de cantidad contratada
      description: |
        Consulta de solo lectura: clasifica el cambio (aumento, reducción o sin cambio),
        calcula importes del periodo, prorrateo (aumentos) y fecha de efecto (reducciones)
        sin modificar la suscripción. Solo el dueño de la cuenta (`owner`, `root` o
        `super-administrador`). Requiere suscripción viva y periodo con días por delante
        para prorratear aumentos.
      tags: [Tenant Billing]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer access token
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
