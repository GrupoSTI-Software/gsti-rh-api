openapi: 3.0.3
info:
  title: Valanserh API - Compliance REPSE
  version: 1.1.0
  description: Empresas contratantes, contratos de servicios especializados con anexo 15-D LFT y documentos firmados.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmpresaContratante:
      type: object
      properties:
        id:
          type: integer
        razonSocial:
          type: string
          minLength: 3
          maxLength: 255
        rfc:
          type: string
          minLength: 12
          maxLength: 13
        domicilioFiscal:
          type: string
          minLength: 10
          maxLength: 500
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    EmpresaContratanteCreate:
      type: object
      required:
        - businessUnitId
        - razonSocial
        - rfc
        - domicilioFiscal
      properties:
        businessUnitId:
          type: integer
          description: Empresa prestadora (extensión vs HU; requerido en API).
        razonSocial:
          type: string
        rfc:
          type: string
        domicilioFiscal:
          type: string
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    EmpresaContratanteUpdate:
      type: object
      properties:
        razonSocial:
          type: string
        rfc:
          type: string
        domicilioFiscal:
          type: string
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        currentPage:
          type: integer
        perPage:
          type: integer
        lastPage:
          type: integer

    ApiError:
      type: object
      properties:
        type:
          type: string
          enum: [error]
        title:
          type: string
        message:
          type: string
        detail:
          type: string
        key:
          type: string
        errorCode:
          type: string
        data:
          nullable: true

    EmpresasContratantesListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            empresasContratantes:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/EmpresaContratante'

    EmpresaContratanteSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            empresaContratante:
              $ref: '#/components/schemas/EmpresaContratante'

    ContratosServiciosEspecializadosListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            contratosServiciosEspecializados:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContratoServicioEspecializado'
      example:
        type: success
        title: Contratos de Servicios Especializados
        message: Contratos obtenidos correctamente
        data:
          contratosServiciosEspecializados:
            meta:
              total: 1
              page: 1
              currentPage: 1
              perPage: 20
              lastPage: 1
            data:
              - id: 42
                numeroContrato: CSE-2026-001
                empresaContratante:
                  id: 1
                  razonSocial: Manufacturas del Norte SA de CV
                  rfc: DMN900101AA1
                fechaInicio: '2026-01-15'
                fechaFin: '2026-03-31'
                objetoServicio: Prestación de servicios especializados de limpieza industrial.
                montoTotal: 450000
                moneda: MXN
                estatus: vencido
                vencidoPorFecha: true
                anexo15d:
                  folioRepse: REPSE-2026-001
                  objetoDetallado: Limpieza profunda de áreas productivas.
                  numeroTrabajadoresAprox: 12
                  fechaInicioServicio: '2026-01-15'
                  fechaFinServicio: '2026-12-31'
                  compromisosDocumentales: []
                  responsabilidadSolidariaAceptada: true
                  textoResponsabilidadSolidaria: Texto de responsabilidad solidaria conforme al artículo 15-D LFT.
                createdAt: '2026-01-15T12:00:00.000Z'
                updatedAt: '2026-01-15T12:00:00.000Z'

    ContratoServicioEspecializadoSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            contratoServicioEspecializado:
              $ref: '#/components/schemas/ContratoServicioEspecializado'
      example:
        type: success
        title: Contrato de Servicios Especializados
        message: Contrato encontrado correctamente
        data:
          contratoServicioEspecializado:
            id: 42
            numeroContrato: CSE-2026-001
            empresaContratante:
              id: 1
              razonSocial: Manufacturas del Norte SA de CV
              rfc: DMN900101AA1
            fechaInicio: '2026-01-15'
            fechaFin: '2026-03-31'
            objetoServicio: Prestación de servicios especializados de limpieza industrial.
            montoTotal: 450000
            moneda: MXN
            estatus: vencido
            vencidoPorFecha: true
            anexo15d:
              folioRepse: REPSE-2026-001
              objetoDetallado: Limpieza profunda de áreas productivas.
              numeroTrabajadoresAprox: 12
              fechaInicioServicio: '2026-01-15'
              fechaFinServicio: '2026-12-31'
              compromisosDocumentales: []
              responsabilidadSolidariaAceptada: true
              textoResponsabilidadSolidaria: Texto de responsabilidad solidaria conforme al artículo 15-D LFT.
            createdAt: '2026-01-15T12:00:00.000Z'
            updatedAt: '2026-01-15T12:00:00.000Z'

    EmpresaContratanteBasica:
      type: object
      properties:
        id:
          type: integer
        razonSocial:
          type: string
        rfc:
          type: string

    CompromisoDocumental:
      type: object
      required: [tipo, descripcion, periodicidad]
      properties:
        tipo:
          type: string
          enum: [cfdi_nomina, comprobante_imss, comprobante_infonavit, otro]
        descripcion:
          type: string
        periodicidad:
          type: string
          enum: [mensual, bimestral, cuatrimestral, anual, por_evento]

    Anexo15D:
      type: object
      properties:
        folioRepse:
          type: string
          description: Autocompletado server-side desde registro REPSE del tenant.
        objetoDetallado:
          type: string
        numeroTrabajadoresAprox:
          type: integer
        fechaInicioServicio:
          type: string
          format: date
        fechaFinServicio:
          type: string
          format: date
          nullable: true
        compromisosDocumentales:
          type: array
          items:
            $ref: '#/components/schemas/CompromisoDocumental'
        responsabilidadSolidariaAceptada:
          type: boolean
        textoResponsabilidadSolidaria:
          type: string

    ContratoServicioEspecializado:
      type: object
      properties:
        id:
          type: integer
        numeroContrato:
          type: string
        empresaContratante:
          $ref: '#/components/schemas/EmpresaContratanteBasica'
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
        objetoServicio:
          type: string
        montoTotal:
          type: number
          nullable: true
        moneda:
          type: string
        estatus:
          type: string
          enum: [borrador, vigente, vencido, cancelado]
          description: |
            Estatus efectivo derivado en lectura. Para contratos declarados vigente,
            puede ser vencido si fecha_fin o el documento firmado vigente ya venció (CDMX).
        vencidoPorFecha:
          type: boolean
          description: |
            true solo cuando el estatus efectivo es vencido por expiración de fecha
            (fecha_fin o documento firmado vigente) y el estatus declarado en BD sigue siendo vigente.
        anexo15d:
          $ref: '#/components/schemas/Anexo15D'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ContratoServicioEspecializadoCreate:
      type: object
      required:
        - empresaContratanteId
        - numeroContrato
        - fechaInicio
        - objetoServicio
        - anexo15d
      properties:
        empresaContratanteId:
          type: integer
        numeroContrato:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
        objetoServicio:
          type: string
        montoTotal:
          type: number
          nullable: true
        moneda:
          type: string
          default: MXN
        estatus:
          type: string
          enum: [borrador, vigente, vencido, cancelado]
        anexo15d:
          type: object
          required:
            - objetoDetallado
            - numeroTrabajadoresAprox
            - fechaInicioServicio
            - compromisosDocumentales
            - textoResponsabilidadSolidaria
          properties:
            objetoDetallado:
              type: string
            numeroTrabajadoresAprox:
              type: integer
            fechaInicioServicio:
              type: string
              format: date
            fechaFinServicio:
              type: string
              format: date
              nullable: true
            compromisosDocumentales:
              type: array
              items:
                $ref: '#/components/schemas/CompromisoDocumental'
            responsabilidadSolidariaAceptada:
              type: boolean
            textoResponsabilidadSolidaria:
              type: string
      example:
        empresaContratanteId: 1
        numeroContrato: CSE-2026-001
        fechaInicio: '2026-01-15'
        fechaFin: '2026-12-31'
        objetoServicio: Prestación de servicios especializados de limpieza industrial en planta y áreas administrativas.
        montoTotal: 450000
        moneda: MXN
        estatus: borrador
        anexo15d:
          objetoDetallado: Limpieza profunda de áreas productivas, sanitarios, pasillos y zonas comunes con personal capacitado, insumos y supervisión en sitio.
          numeroTrabajadoresAprox: 12
          fechaInicioServicio: '2026-01-15'
          fechaFinServicio: '2026-12-31'
          compromisosDocumentales:
            - tipo: cfdi_nomina
              descripcion: Entrega mensual de CFDI de nómina por cada trabajador asignado al servicio
              periodicidad: mensual
            - tipo: comprobante_imss
              descripcion: Comprobante de pago de cuotas obrero-patronales ante el IMSS
              periodicidad: bimestral
            - tipo: comprobante_infonavit
              descripcion: Comprobante de aportaciones al INFONAVIT conforme al contrato de subcontratación
              periodicidad: bimestral
          responsabilidadSolidariaAceptada: true
          textoResponsabilidadSolidaria: Las partes reconocen la responsabilidad solidaria prevista en el artículo 15-D de la Ley Federal del Trabajo cuando el prestador incumpla obligaciones laborales o de seguridad social.

    ContratoServicioEspecializadoUpdate:
      type: object
      properties:
        numeroContrato:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
        objetoServicio:
          type: string
        montoTotal:
          type: number
          nullable: true
        moneda:
          type: string
        estatus:
          type: string
          enum: [borrador, vigente, vencido, cancelado]
        anexo15d:
          type: object
          properties:
            objetoDetallado:
              type: string
            numeroTrabajadoresAprox:
              type: integer
            fechaInicioServicio:
              type: string
              format: date
            fechaFinServicio:
              type: string
              format: date
              nullable: true
            compromisosDocumentales:
              type: array
              items:
                $ref: '#/components/schemas/CompromisoDocumental'
            responsabilidadSolidariaAceptada:
              type: boolean
            textoResponsabilidadSolidaria:
              type: string
      example:
        estatus: vigente
        montoTotal: 475000
        anexo15d:
          numeroTrabajadoresAprox: 15
          compromisosDocumentales:
            - tipo: cfdi_nomina
              descripcion: CFDI de nómina mensual actualizado
              periodicidad: mensual

    DocumentoContratoEspecializado:
      type: object
      properties:
        documentoId:
          type: integer
        contratoId:
          type: integer
        origen:
          type: string
          enum: [subido, firmado_canvas]
        vigente:
          type: boolean
        fechaInicioVigencia:
          type: string
          format: date
        fechaVencimiento:
          type: string
          format: date
        nombreArchivo:
          type: string
        mimeType:
          type: string
        tamanoBytes:
          type: integer
        subidoPor:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    DocumentoContratoEspecializadoSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            documentoContrato:
              $ref: '#/components/schemas/DocumentoContratoEspecializado'

    DocumentosContratoListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            documentoContrato:
              type: object
              properties:
                documentos:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocumentoContratoEspecializado'

paths:
  /api/empresas-contratantes:
    get:
      summary: Lista paginada de empresas contratantes
      tags: [EmpresasContratantes]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            maximum: 500
        - name: q
          in: query
          schema:
            type: string
        - name: businessUnitId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Listado paginado de empresas contratantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresasContratantesListSuccess'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso read o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Validación de filtros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      summary: Crear empresa contratante
      tags: [EmpresasContratantes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaContratanteCreate'
      responses:
        '201':
          description: Empresa contratante creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaContratanteSuccess'
        '400':
          description: RFC inválido (key rfc-invalido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso create o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Empresa prestadora no encontrada en el tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: RFC duplicado (key rfc-duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/empresas-contratantes/{id}:
    get:
      summary: Detalle de empresa contratante
      tags: [EmpresasContratantes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de empresa contratante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaContratanteSuccess'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso read o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: key empresa-contratante-no-encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    patch:
      summary: Actualizar empresa contratante (parcial)
      tags: [EmpresasContratantes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaContratanteUpdate'
      responses:
        '200':
          description: Empresa contratante actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaContratanteSuccess'
        '400':
          description: Validación VineJS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso update o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: key empresa-contratante-no-encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: RFC duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      summary: Soft delete
      tags: [EmpresasContratantes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado lógicamente (sin cuerpo)
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso delete o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: key empresa-contratante-no-encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Empresa con contratos asociados (key empresa-con-contratos-activos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/contratos-servicios-especializados:
    get:
      summary: Lista paginada de contratos de servicios especializados
      tags: [ContratosServiciosEspecializados]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            maximum: 500
        - name: estatus
          in: query
          description: |
            Uno o varios estatus (CSV o repetido). Semántica efectiva en lectura:
            vencido incluye declarados vencidos más vigentes expirados por fecha_fin o documento;
            vigente excluye vigentes expirados por fecha. Ej. vigente,borrador
          schema:
            oneOf:
              - type: string
                enum: [borrador, vigente, vencido, cancelado]
              - type: array
                items:
                  type: string
                  enum: [borrador, vigente, vencido, cancelado]
        - name: empresaContratanteId
          in: query
          schema:
            type: integer
        - name: fechaInicioDesde
          in: query
          schema:
            type: string
            format: date
        - name: fechaInicioHasta
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Listado paginado con anexo, contratante básico y estatus efectivo por contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratosServiciosEspecializadosListSuccess'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso read o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Validación de filtros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      summary: Crear contrato con anexo 15-D embebido
      tags: [ContratosServiciosEspecializados]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoServicioEspecializadoCreate'
      responses:
        '201':
          description: Contrato creado con folioRepse autocompletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoServicioEspecializadoSuccess'
        '400':
          description: Validación VineJS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso create o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: key empresa-contratante-no-encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: key numero-contrato-duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Fechas inválidas o registro-repse-no-encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/contratos-servicios-especializados/{id}:
    get:
      summary: Detalle de contrato con anexo 15-D
