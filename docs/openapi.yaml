paths:
  /api/employees/{employeeId}/temporary-assignments:
    post:
      summary: Crear préstamo temporal para un empleado
      tags: [Employee Temporary Assignments]
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeTemporaryAssignmentCreate'
      responses:
        '201':
          description: Préstamo creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTemporaryAssignmentSuccess'
        '400':
          description: key body-invalido o dias-invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Empleado no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: key prestamo-solapado, conflicto-vacaciones-incapacidad-permiso o debe-cancelar-prestamo-activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: key sucursal-destino-igual-a-origen o turno-destino-no-configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: Listar historial de préstamos de un empleado
      tags: [Employee Temporary Assignments]
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historial del empleado (incluye cancelados, excluye eliminados)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTemporaryAssignmentListSuccess'
        '400':
          description: key body-invalido, fecha-cancelacion-invalida o fecha-cancelacion-fuera-vigencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Empleado no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/employees/{employeeId}/temporary-assignments/active:
    get:
      summary: Obtener préstamo temporal activo de un empleado
      tags: [Employee Temporary Assignments]
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Préstamo activo encontrado o null si no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTemporaryAssignmentActiveSuccess'
        '404':
          description: Empleado no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/employees/{employeeId}/temporary-assignments/{id}:
    put:
      summary: Editar préstamo temporal del empleado
      tags: [Employee Temporary Assignments]
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeTemporaryAssignmentUpdate'
      responses:
        '200':
          description: Préstamo actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTemporaryAssignmentSuccess'
        '400':
          description: key body-invalido o dias-invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Empleado o préstamo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: key prestamo-no-editable o prestamo-solapado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: key turno-destino-no-configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Eliminar lógicamente un préstamo temporal
      tags: [Employee Temporary Assignments]
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Préstamo eliminado lógicamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTemporaryAssignmentDeleteSuccess'
        '404':
          description: Empleado o préstamo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/employees/{employeeId}/temporary-assignments/{id}/cancel:
    post:
      summary: Cancelar anticipadamente un préstamo temporal
      tags: [Employee Temporary Assignments]
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeTemporaryAssignmentCancel'
      responses:
        '200':
          description: Préstamo cancelado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTemporaryAssignmentCancelSuccess'
        '400':
          description: key body-invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Empleado o préstamo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: key prestamo-no-editable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/repse/coverage-report:
    get:
      summary: Reporte de cobertura REPSE por empleado y empresa
      tags: [RepseCoverageReport]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
      responses:
        '200':
          description: Reporte calculado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepseCoverageReportSuccess'
              example:
                type: success
                title: Recursos
                message: Los recursos fueron encontrados correctamente
                data:
                  meta:
                    total: 1
                    perPage: 20
                    currentPage: 1
                    lastPage: 1
                  data:
                    - employeeId: 1
                      employeeName: Empleado Temporal Repse
                      employeeCode: TRC-E001
                      diasLaborados: 5
                      companies:
                        - companyId: 1
                          companyName: Empresa temporal REPSE Coverage
                          diasBase: 0
                          diasPrestados: 5
                          diasServidos: 5
                          porcentajeObservado: 100
                          porcentajeDeclarado: 100
                          diferencia: 0
                      movimientos:
                        - assignmentId: 1
                          startDate: '2026-06-10'
                          endDate: '2026-06-16'
                          effectiveEndDate: '2026-06-16'
                          sourceBranchId: 1
                          sourceBranchName: Sucursal Matriz
                          sourceCompanyId: null
                          sourceCompanyName: null
                          targetBranchId: 2
                          targetBranchName: Sucursal Cliente Norte
                          targetCompanyId: 1
                          targetCompanyName: Empresa temporal REPSE Coverage
                          reason: cobertura
        '400':
          description: Datos inválidos (key query-invalida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Error de validación
                message: El campo from es obligatorio
                key: query-invalida
                data:
                  errors:
                    - message: El campo from es obligatorio
                      rule: required
                      field: from
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: No autenticado
                message: No autenticado
                data: null
        '403':
          description: Sin permiso read o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Sin permiso
                message: No cuentas con permisos para realizar esta acción.
                key: sin-permiso
                data: null
        '422':
          description: Rango de fechas inválido (key rango-fechas-invalido o rango-maximo-excedido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                rangoFechasInvalido:
                  summary: key rango-fechas-invalido
                  value:
                    type: error
                    title: Error de validación
                    message: El rango de fechas es inválido.
                    key: rango-fechas-invalido
                    data: null
                rangoMaximoExcedido:
                  summary: key rango-maximo-excedido
                  value:
                    type: error
                    title: Error de validación
                    message: El rango de fechas excede el máximo permitido
                    key: rango-maximo-excedido
                    data:
                      maxDays: 366
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Error del servidor
                message: Ocurrió un error inesperado en el servidor
                data: null

