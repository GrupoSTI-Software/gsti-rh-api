  /api/billing/subscription/changes/increase:
    post:
      summary: Solicitar aumento de cantidad contratada
      description: |
        Registra la solicitud de aumento y genera el adeudo prorrateado cuando la suscripción
        ya está pagando, o aplica de inmediato sin cobro en periodo de prueba. Solo el dueño
        de la cuenta (`owner`, `root` o `super-administrador`). El cupo no sube hasta que
        Valanserh registre el pago del adeudo, salvo en prueba.
      tags: [Tenant Billing]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer access token
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUID público de la unidad de negocio activa
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
            enum: [es, en]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employees]
              properties:
                employees:
                  type: integer
                  minimum: 1
                  description: Cantidad pedida (bloques de 10; reglas comerciales en el servicio)
      responses:
        '201':
          description: Solicitud registrada (pending_payment o applied en prueba)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionIncreaseRequestResponse'
        '401':
          description: No autenticado
        '403':
          description: Rol distinto de owner/root/super-administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionApiError'
              example:
                title: Acceso restringido
                detail: Solo el dueño de la cuenta puede solicitar cambios en la suscripción.
                key: solo-el-dueno-de-la-cuenta
                code: PLT.SUB.FORBIDDEN_ROLE
        '409':
          description: La suscripción cambió mientras se procesaba la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionApiError'
              example:
                title: Suscripciones
                detail: Tu suscripción cambió mientras procesábamos la solicitud. Vuelve a intentarlo.
                key: cambio-en-conflicto
                code: PLT.SUB.CHANGE_CONFLICT
        '422':
          description: |
            Cantidad inválida, no es un aumento, sin suscripción viva, pago atrasado o periodo no prorrateable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionApiError'
              examples:
                changeNotAnIncrease:
                  summary: La cantidad no es un aumento
                  value:
                    title: Suscripciones
                    detail: La cantidad solicitada no es mayor a tu cantidad contratada actual.
                    key: cantidad-no-es-aumento
                    code: PLT.SUB.CHANGE_NOT_AN_INCREASE
                noLiveSubscription:
                  summary: Sin suscripción viva
                  value:
                    title: Suscripciones
                    detail: No tienes una contratación viva que se pueda cambiar.
                    key: sin-suscripcion-viva
                    code: PLT.SUB.NO_LIVE_SUBSCRIPTION
        '429':
          description: Límite de solicitudes de cambio excedido (billing-change-request)

  /api/billing/subscription/changes/decrease:
    post:
      summary: Agendar reducción de cantidad contratada
      description: |
        Registra una reducción para que surta efecto al inicio del próximo periodo.
        No modifica el cupo ni los importes del periodo en curso; no cobra ni devuelve
        dinero. Solo el dueño de la cuenta (`owner`, `root` o `super-administrador`).
        Si ya existía otra petición viva, la sustituye.
      tags: [Tenant Billing]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer access token
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUID público de la unidad de negocio activa
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
            enum: [es, en]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employees]
              properties:
                employees:
                  type: integer
                  minimum: 1
                  description: Cantidad destino (bloques de 10; reglas comerciales en el servicio)
      responses:
        '201':
          description: Reducción agendada (scheduled) para la fecha de corte vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionChangeRecordResponse'
        '401':
          description: No autenticado
        '403':
          description: Rol distinto de owner/root/super-administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionApiError'
              example:
                title: Acceso restringido
                detail: Solo el dueño de la cuenta puede cambiar la cantidad contratada.
                key: solo-el-dueno-de-la-cuenta
                code: PLT.SUB.FORBIDDEN_ROLE
        '422':
          description: |
            Cantidad inválida, no es reducción, sin suscripción viva, pago atrasado
            o periodo sin fecha de corte por delante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionApiError'
              examples:
                changeNotADecrease:
                  summary: La cantidad no es una reducción
                  value:
                    title: Suscripciones
                    detail: Esta operación solo reduce la cantidad contratada. Tienes 120 empleados contratados y pediste 150.
                    key: cambio-no-es-reduccion
                    code: PLT.SUB.CHANGE_NOT_A_DECREASE
                employeesBelowActiveHeadcount:
                  summary: Cantidad por debajo del mínimo por plantilla
                  value:
                    title: Suscripciones
                    detail: Tienes 73 empleados activos. La cantidad mínima que puedes contratar es 80.
                    key: cantidad-menor-a-plantilla-activa
                    code: PLT.SUB.EMPLOYEES_BELOW_ACTIVE_HEADCOUNT
                noLiveSubscription:
                  summary: Sin suscripción viva
                  value:
                    title: Suscripciones
                    detail: No tienes una contratación viva que se pueda cambiar.
                    key: sin-suscripcion-viva
                    code: PLT.SUB.NO_LIVE_SUBSCRIPTION
        '429':
          description: Límite de solicitudes de cambio excedido (billing-subscription-change)

  /api/billing/subscription/changes/cancel:
    post:
      summary: Cancelar cambio de suscripción agendado
      description: |
        Cancela la petición de cambio viva (`pending_payment` o `scheduled`) de la
        empresa activa. No modifica la suscripción. Solo el dueño de la cuenta
