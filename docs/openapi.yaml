  /api/contratos-servicios-especializados/importacion:
    post:
      summary: Importa contratos de servicios especializados desde un archivo Excel
      description: |
        Valida que el archivo sea un Excel real y que sus cabeceras se emparejen con la
        plantilla; procesa cada fila de forma secuencial (sin transacción global),
        resolviendo el contratante por RFC (índice ciego) y los servicios registrados por
        nombre, y reúsa `create` para dar de alta cada fila válida. Las filas inválidas se
        reportan con su número y motivo sin detener el procesamiento de las demás
        (USRH1785509296682). Máximo 500 filas de datos por archivo. Limitada a 10 intentos / 15 minutos por usuario.
      tags: [ContratosServiciosEspecializados]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer access token
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: integer
          description: Identificador de unidad de negocio
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
            enum: [es, en]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Archivo Excel (.xlsx) de máximo 10 MB
      responses:
        '200':
          description: Importación procesada (filas válidas creadas, filas inválidas reportadas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoServicioEspecializadoImportacionSuccess'
        '400':
          description: Archivo ausente/no es Excel válido, cabeceras no emparejables (key archivo-no-excel / cabeceras-invalidas) o más de 500 filas de datos (key filas-excedidas); ninguna fila se procesa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                cabecerasInvalidas:
                  value:
                    type: error
                    title: Cabeceras inválidas
                    message: No se pudieron emparejar las cabeceras del archivo con la plantilla. Descargue la plantilla vigente y no modifique la fila 1.
                    key: cabeceras-invalidas
                    errorCode: CSE.IMP.HEADERS.001
                    data: null
                filasExcedidas:
                  value:
                    type: error
                    title: Demasiadas filas en el archivo
                    message: El archivo tiene 501 filas de datos, por encima del máximo permitido (500). Divide el archivo en lotes más pequeños.
                    key: filas-excedidas
                    errorCode: CSE.IMP.ROWS.001
                    data: null
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Sin permiso create o gestion (key sin-permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Límite de 10 intentos de importación / 15 minutos por usuario excedido (`key: importacion-rate-limit`, `errorCode: CSE.IMP.RATE.001`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Límite de intentos de importación alcanzado
                message: Alcanzó el límite de intentos de importación de contratos. Intente de nuevo más tarde.
                key: importacion-rate-limit
                errorCode: CSE.IMP.RATE.001
                data: null

