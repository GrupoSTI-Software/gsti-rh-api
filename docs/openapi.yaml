          description: Rol distinto de owner/root/super-administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionApiError'
              example:
                title: Acceso restringido
                detail: Solo el dueño de la cuenta puede cambiar la cantidad contratada.
                key: solo-el-dueno-de-la-cuenta
                code: PLT.SUB.FORBIDDEN_ROLE
        '422':
          description: Sin cambio vivo, sin suscripción viva o pago atrasado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionApiError'
