    RepseProvider:
      type: object
      description: |
        Catálogo de proveedores REPSE del contratante (USRH1784259105646).
        Lado contratante: el tenant es quien contrata servicios especializados
        y cataloga a SUS proveedores REPSE, a diferencia de `RepseRegistration`
        (lado prestador).
      properties:
        proveedorRepseId:
          type: integer
        businessUnitId:
          type: integer
        razonSocial:
          type: string
        rfc:
          type: string
        folio:
          type: string
        objetoRegistrado:
          type: string
        folioVencimiento:
          type: string
          format: date
        periodicidadMeses:
          type: integer
        nextReviewAt:
          type: string
          format: date
          nullable: true
        reviewStatus:
          type: string
          enum: [pending_first_validation, on_track, due_soon, overdue]
          description: |
            Indicador MVP de próxima revisión (sin correo). `overdue` aplica tanto si
            el ciclo de validaciones (`nextReviewAt`) ya venció como si `folioVencimiento`
            ya pasó (aunque no le toque su próxima revisión periódica todavía).
        proveedorRepseCreatedAt:
          type: string
          format: date-time
        proveedorRepseUpdatedAt:
          type: string
          format: date-time
          nullable: true

    RepseProviderCreate:
      type: object
      required: [businessUnitId, razonSocial, rfc, folio, objetoRegistrado, folioVencimiento]
      properties:
        businessUnitId:
          type: integer
        razonSocial:
          type: string
          maxLength: 255
        rfc:
          type: string
          minLength: 12
          maxLength: 13
        folio:
          type: string
          maxLength: 50
        objetoRegistrado:
          type: string
          maxLength: 1000
        folioVencimiento:
          type: string
          format: date
          description: Debe ser hoy o una fecha futura (AAAA-MM-DD); no se acepta un folio ya vencido.
        periodicidadMeses:
          type: integer
          minimum: 1
          maximum: 60
          default: 1

    RepseProviderUpdate:
      type: object
      properties:
        businessUnitId:
          type: integer
        razonSocial:
          type: string
          maxLength: 255
        rfc:
          type: string
          minLength: 12
          maxLength: 13
        folio:
          type: string
          maxLength: 50
        objetoRegistrado:
          type: string
          maxLength: 1000
        folioVencimiento:
          type: string
          format: date
          description: |
            Debe ser hoy o una fecha futura (AAAA-MM-DD); no se acepta un folio ya vencido.
        periodicidadMeses:
          type: integer
          minimum: 1
          maximum: 60
          description: Si cambia, `nextReviewAt` se recalcula a partir de la última validación registrada.

    RepseProvidersResponseI18nContract:
      type: object
      description: |
        Contrato i18n del módulo REPSE (proveedores, validaciones y expediente).
        `title` y `message` varían según el header `Accept-Language` (`es` default, `en`).
        Las claves de `data` son **estables** (camelCase) y **no cambian** con el idioma:
        | Operación | Clave en `data` |
        |-----------|-----------------|
        | GET listado proveedores | `proveedoresRepse` |
        | GET/POST/PUT/DELETE proveedor | `proveedorRepse` |
        | GET validaciones | `validaciones` |
        | POST validación | `validacion` |
        | GET expediente | `expediente` |
        | POST documento expediente | `documentoExpediente` |

    RepseProviderSuccess:
      type: object
      description: |
        Respuesta exitosa de un proveedor REPSE. Ver `RepseProvidersResponseI18nContract`
        para el contrato i18n; la clave de payload es siempre `data.proveedorRepse`.
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
          description: Traducido según `Accept-Language`.
        message:
          type: string
          description: Traducido según `Accept-Language`.
        data:
          type: object
          required: [proveedorRepse]
          properties:
            proveedorRepse:
              $ref: '#/components/schemas/RepseProvider'

