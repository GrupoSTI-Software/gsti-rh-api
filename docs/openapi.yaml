  /api/employees/import-excel:
    post:
      summary: Importar empleados desde archivo Excel
      description: |
        Carga masiva de empleados. Requiere Bearer token y header X-Business-Unit-Id.
        La actualización aplica solo cuando la fila incluye la columna oculta ID Empleado.
        Si el archivo incluye altas nuevas y rebasa el cupo efectivo, responde **409** y
        no aplica ninguna fila (todo-o-nada). Un archivo con solo correcciones no evalúa cupo.
      tags: [Employees]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer access token
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: integer
          description: Identificador de unidad de negocio
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
            enum: [es, en]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Importación procesada
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [success, warning]
                  title:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          totalRows:
                            type: integer
                          processed:
                            type: integer
                          created:
                            type: integer
                          updated:
                            type: integer
                          failed:
                            type: integer
                          skipped:
                            type: integer
                          limitReached:
                            type: boolean
                            deprecated: true
                            description: Siempre false. Si el cupo no alcanza, la API responde 409 sin escribir nada.
                      rowErrors:
                        type: array
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                            field:
                              type: string
                            message:
                              type: string
                      warnings:
                        type: array
                        items:
                          type: string
                      errors:
                        type: array
                        description: Alias legado deprecado
                        items:
                          type: string
              example:
                type: warning
                title: Importación completada con advertencias
                message: Se procesaron 7 empleados
                data:
                  summary:
                    totalRows: 10
                    processed: 7
                    created: 5
                    updated: 2
                    failed: 3
                    skipped: 3
                    limitReached: false
                  rowErrors:
                    - row: 5
                      field: Nombre del empleado
                      message: Falta el campo obligatorio
                  warnings: []
                  errors:
                    - 'Fila 5: Falta el campo obligatorio'
        '400':
          description: Archivo inválido o cabeceras faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                cabecerasInvalidas:
                  value:
                    type: error
                    title: Cabeceras del archivo inválidas
                    message: 'Faltan los siguientes encabezados requeridos: Identificador de nómina'
                    detail: 'Faltan los siguientes encabezados requeridos: Identificador de nómina'
                    key: cabeceras-invalidas
                    code: EMP.IMPORT.VAL_HEADERS
                    data: null
                archivoInvalido:
                  value:
                    type: error
                    title: Archivo inválido
                    message: El archivo del campo «file» debe ser un Excel válido (.xlsx, .xls).
                    detail: El archivo del campo «file» debe ser un Excel válido (.xlsx, .xls).
                    key: archivo-invalido
                    code: EMP.IMPORT.VAL_FILE
                    data:
                      multipartField: file
                      acceptedExtensions: ['.xlsx', '.xls']
                      contentType: multipart/form-data
                archivoFaltante:
                  value:
                    type: error
                    title: Archivo inválido
                    message: Falta el archivo en multipart/form-data. Envíe un Excel en el campo «file» (.xlsx, .xls).
                    detail: Falta el archivo en multipart/form-data. Envíe un Excel en el campo «file» (.xlsx, .xls).
                    key: archivo-invalido
                    code: EMP.IMPORT.VAL_FILE
                    data:
                      multipartField: file
                      acceptedExtensions: ['.xlsx', '.xls']
                      contentType: multipart/form-data
        '409':
          description: |
            El archivo rebasa el cupo de empleados o la empresa self-service no tiene plan vigente.
            No se aplica ninguna fila del Excel (todo-o-nada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeImportQuotaApiError'
              examples:
                cupoRebasado:
                  value:
                    type: error
                    title: El archivo rebasa tu cupo de empleados
                    message: El archivo daría de alta 5 empleados y solo te quedan 2 lugares.
                    detail: 'Contratados: 20. Vigentes: 18. Altas en el archivo: 5. No se aplicó ninguna línea del archivo; escríbenos a hola@valanserh.com para ampliar tu cupo.'
                    key: cupo-empleados-agotado-importacion
                    code: EMP.IMPORT.QUOTA_EXCEEDED
                    data:
                      contracted: 20
                      active: 18
                      incoming: 5
                sinPlan:
                  value:
                    type: error
                    title: No tienes un plan vigente
                    message: No se aplicó ninguna línea del archivo porque tu empresa no tiene un plan vigente.
                    detail: El archivo traía 3 altas y no se aplicó ninguna. Escríbenos a hola@valanserh.com para activar tu plan y vuelve a subirlo.
                    key: sin-plan-contratado-importacion
                    code: EMP.IMPORT.NO_PLAN
                    data:
                      contracted: 0
                      active: 12
                      incoming: 3
        '500':
          description: Error inesperado del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Error del servidor
                message: Ocurrió un error inesperado durante la importación.
                detail: Ocurrió un error inesperado durante la importación.
                key: error-importacion
                code: EMP.IMPORT.SERVER
                data: null

