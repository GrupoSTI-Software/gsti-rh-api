openapi: 3.0.3
info:
  title: Valanserh API - Compliance REPSE
  version: 1.3.0
  description: Empresas contratantes, contratos de servicios especializados con anexo 15-D LFT, documentos firmados, asignación de trabajadores y sucursales como sitios de servicio REPSE.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmpresaContratante:
      type: object
      properties:
        id:
          type: integer
        razonSocial:
          type: string
          minLength: 3
          maxLength: 255
        rfc:
          type: string
          minLength: 12
          maxLength: 13
        domicilioFiscal:
          type: string
          minLength: 10
          maxLength: 500
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    EmpresaContratanteCreate:
      type: object
      required:
        - businessUnitId
        - razonSocial
        - rfc
        - domicilioFiscal
      properties:
        businessUnitId:
          type: integer
          description: Empresa prestadora (extensión vs HU; requerido en API).
        razonSocial:
          type: string
        rfc:
          type: string
        domicilioFiscal:
          type: string
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    EmpresaContratanteUpdate:
      type: object
      properties:
        razonSocial:
          type: string
        rfc:
          type: string
        domicilioFiscal:
          type: string
        representanteLegal:
          type: string
          nullable: true
        correo:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        currentPage:
          type: integer
        perPage:
          type: integer
        lastPage:
          type: integer

    ApiError:
      type: object
      properties:
        type:
          type: string
          enum: [error]
        title:
          type: string
        message:
          type: string
        detail:
          type: string
        key:
          type: string
        errorCode:
          type: string
        data:
          nullable: true

    Nom035QrunError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Aplicación NOM-035
        message: Sucursal no aplicable para lanzamiento de cuestionario
        detail: Sucursal no aplicable para lanzamiento de cuestionario
        key: sucursal-no-aplicable
        code: NOM035.QRUN.NOT_APPLICABLE
        data: null

    Nom035DisclosureSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            disclosure:
              oneOf:
                - type: object
                  properties:
                    available:
                      type: boolean
                      enum: [false]
                    branchOfficeId:
                      type: integer
                    branchOfficeName:
                      type: string
                - type: object
                  properties:
                    available:
                      type: boolean
                      enum: [true]
                    branchOfficeId:
                      type: integer
                    branchOfficeName:
                      type: string
                    applicationId:
                      type: integer
                    instrumentCode:
                      type: string
                    respondersCount:
                      type: integer
                    overall:
                      type: object
                      properties:
                        score:
                          type: number
                        riskLevel:
                          type: string
                          nullable: true
                          enum: [nulo, bajo, medio, alto, muy_alto, null]
                    categories:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                          score:
                            type: number
                            nullable: true
                          riskLevel:
                            type: string
                            nullable: true
                            enum: [nulo, bajo, medio, alto, muy_alto, null]
                          respondersCount:
                            type: integer
                          suppressed:
                            type: boolean
                    domains:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                          categoryCode:
                            type: string
                          score:
                            type: number
                            nullable: true
                          riskLevel:
                            type: string
                            nullable: true
                            enum: [nulo, bajo, medio, alto, muy_alto, null]
                          respondersCount:
                            type: integer
                          suppressed:
                            type: boolean

    LegalDocumentCurrentSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            type:
              type: string
              enum: [privacy_notice, terms_conditions, biometric_consent]
            version:
              type: string
              example: '1.0'
            content:
              type: string
              description: Contenido HTML saneado de la versión vigente.
            publishedAt:
              type: string
              format: date-time
              nullable: true

    LegalDocumentAdmin:
      type: object
      description: Forma administrativa de una versión (gestión reservada al rol root).
      properties:
        id:
          type: integer
          example: 6
        type:
          type: string
          enum: [privacy_notice, terms_conditions, biometric_consent]
        version:
          type: string
          example: '1.0'
        content:
          type: object
          description: Contenido HTML saneado por idioma.
          properties:
            es:
              type: string
            en:
              type: string
        status:
          type: string
          enum: [draft, published]
        isCurrent:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        publishedBy:
          type: object
          nullable: true
          description: Quién publicó la versión, resuelto a un nombre visible en UI.
          properties:
            userId:
              type: integer
              example: 12
            name:
              type: string
              example: 'Ana Root'
            email:
              type: string
              example: 'ana.root@gsti.mx'

    LegalDocumentAdminSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/LegalDocumentAdmin'

    LegalDocumentAdminListSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocumentAdmin'

    ConsentStatusSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            accepted:
              type: boolean
              description: "RETROCOMPAT: true ⟺ pendingDocuments.length === 0 para la audiencia de la sesión."
            pendingDocuments:
              type: array
              description: Documentos vigentes que al usuario le falta aceptar, filtrados por audiencia (web o app).
              items:
                type: object
                properties:
                  legalDocumentId:
                    type: number
                    example: 2
                  type:
                    type: string
                    enum: [privacy_notice, terms_conditions, biometric_consent]
                  version:
                    type: string
                    example: '1.0'
            currentVersion:
              type: string
              nullable: true
              description: "DEPRECATED conservado: versión vigente del privacy_notice (compat)."
              example: '1.0'
            acceptedVersion:
              type: string
              nullable: true
              description: "DEPRECATED conservado: última versión de privacy_notice aceptada por el usuario (compat)."
            acceptedAt:
              type: string
              format: date-time
              nullable: true

    QuestionnaireApplicationListItem:
      type: object
      properties:
        questionnaireApplicationId:
          type: integer
        folio:
          type: string
        branchOfficeId:
          type: integer
        branchOfficeName:
          type: string
        applicableInstrument:
          type: string
          enum: [guide_ii, guide_iii]
        status:
          type: string
          enum: [borrador, en-curso, cerrada]
        targetCount:
          type: integer
        respondedCount:
          type: integer
        completionStatus:
          type: string
          enum: [none, partial, full]
        launchedAt:
          type: string
          format: date-time

    QuestionnaireApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/QuestionnaireApplicationListItem'
        - type: object
          properties:
            businessUnitId:
              type: integer
            regulationQuestionnaireId:
              type: integer
            closedAt:
              type: string
              format: date-time
              nullable: true

    QuestionnaireApplicationCreate:
      type: object
      required: [branchOfficeId]
      properties:
        branchOfficeId:
          type: integer
          minimum: 1

    QuestionnaireApplicationCloseRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000

    QuestionnaireApplicationSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            questionnaireApplication:
              $ref: '#/components/schemas/QuestionnaireApplicationDetail'

    QuestionnaireApplicationListSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            questionnaireApplications:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/QuestionnaireApplicationListItem'

    QuestionnaireApplicabilityItem:
      type: object
      properties:
        branchOfficeId:
          type: integer
        branchOfficeName:
          type: string
        activeEmployees:
          type: integer
        applicableInstrument:
          type: string
          enum: [none, guide_ii, guide_iii]
        canLaunch:
          type: boolean
        launchBlockReason:
          type: string
          enum: [NOT_APPLICABLE, OPEN_ROUND_EXISTS]
          nullable: true
        blockingApplicationId:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true

    QuestionnaireApplicabilityListSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            questionnaireApplicabilities:
              type: array
              items:
                $ref: '#/components/schemas/QuestionnaireApplicabilityItem'

    QuestionnaireApplicabilitySuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            questionnaireApplicability:
              $ref: '#/components/schemas/QuestionnaireApplicabilityItem'

    QuestionnaireApplicationStateLogItem:
      type: object
      properties:
        questionnaireApplicationStateLogId:
          type: integer
        fromStatus:
          type: string
          enum: [borrador, en-curso, cerrada]
        toStatus:
          type: string
          enum: [borrador, en-curso, cerrada]
        note:
          type: string
        actorUser:
          type: object
          properties:
            userId:
              type: integer
            email:
              type: string
            fullName:
              type: string
              nullable: true
        createdAt:
          type: string
          format: date-time

    QuestionnaireApplicationStateHistorySuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            stateHistory:
              type: array
              items:
                $ref: '#/components/schemas/QuestionnaireApplicationStateLogItem'

    QuestionnaireApplicationTargetItem:
      type: object
      properties:
        questionnaireApplicationTargetId:
          type: integer
        employeeId:
          type: integer
        employeeCode:
          oneOf:
            - type: integer
            - type: string
        employeePayrollNum:
          type: string
        employeeFullName:
          type: string
          description: Nombre completo del empleado
        departmentName:
          type: string
          nullable: true
        positionName:
          type: string
          nullable: true
        status:
          type: string
          enum: [pendiente, respondido]
        captureStatus:
          type: string
          enum: [pendiente, borrador, respondido]
          description: Estado de captura derivado de target + response
        respondedAt:
          type: string
          format: date-time
          nullable: true

    QuestionnaireApplicationTargetsSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            targets:
              type: array
              items:
                $ref: '#/components/schemas/QuestionnaireApplicationTargetItem'

    QuestionnaireCaptureAnswerInput:
      type: object
      required: [questionId, optionKey]
      properties:
        questionId:
          type: integer
          minimum: 1
        optionKey:
          type: string

    QuestionnaireCaptureSubmitRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuestionnaireCaptureAnswerInput'

    QuestionnaireCaptureDraftRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireCaptureAnswerInput'

    QuestionnaireCaptureScaleOption:
      type: object
      properties:
        key:
          type: string
        value:
          type: integer

    QuestionnaireCaptureScale:
      type: object
      properties:
        code:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireCaptureScaleOption'

    QuestionnaireCaptureQuestion:
      type: object
      properties:
        questionId:
          type: integer
        textKey:
          type: string
        helpKey:
          type: string
          nullable: true
        answerScale:
          $ref: '#/components/schemas/QuestionnaireCaptureScale'

    QuestionnaireCaptureSection:
      type: object
      properties:
        titleKey:
          type: string
        ord:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireCaptureQuestion'

    QuestionnaireCaptureInstrument:
      type: object
      properties:
        questionnaireApplicationId:
          type: integer
        employeeId:
          type: integer
        instrument:
          type: string
          enum: [guide_ii, guide_iii]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireCaptureSection'

    QuestionnaireCaptureInstrumentSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            instrument:
              $ref: '#/components/schemas/QuestionnaireCaptureInstrument'

    QuestionnaireApplicationResponseDetail:
      type: object
      properties:
        questionnaireApplicationResponseId:
          type: integer
        employeeId:
          type: integer
        answeredCount:
          type: integer
        targetStatus:
          type: string
          enum: [respondido]
        respondedAt:
          type: string
          format: date-time

    QuestionnaireApplicationResponseSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            questionnaireApplicationResponse:
              $ref: '#/components/schemas/QuestionnaireApplicationResponseDetail'

    QuestionnaireApplicationDraftDetail:
      type: object
      properties:
        questionnaireApplicationResponseId:
          type: integer
        status:
          type: string
          enum: [borrador]
        answeredCount:
          type: integer

    QuestionnaireApplicationDraftSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            questionnaireApplicationResponse:
              $ref: '#/components/schemas/QuestionnaireApplicationDraftDetail'

    QuestionnaireApplicationSavedResponseAnswer:
      type: object
      properties:
        questionId:
          type: integer
        optionKey:
          type: string
        value:
          type: integer

    QuestionnaireApplicationSavedResponseDetail:
      type: object
      properties:
        questionnaireApplicationResponseId:
          type: integer
        status:
          type: string
          enum: [borrador, respondido]
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireApplicationSavedResponseAnswer'

    QuestionnaireApplicationSavedResponseSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            questionnaireApplicationResponse:
              $ref: '#/components/schemas/QuestionnaireApplicationSavedResponseDetail'

    Nom035PrgError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Programa de atención NOM-035
        message: Ya existe un Programa abierto para la empresa
        detail: Ya existe un Programa abierto para la empresa
        key: programa-abierto
        code: NOM035.PRG.ALREADY_OPEN
        data: null

    AttentionProgramCatalogDimensionItem:
      type: object
      properties:
        psychosocialDimensionId:
          type: integer
        code:
          type: string
        nameKey:
          type: string
        name:
          type: string
        ord:
          type: integer

    AttentionProgramCatalogLevelItem:
      type: object
      properties:
        attentionActionLevelId:
          type: integer
        code:
          type: string
        nameKey:
          type: string
        name:
          type: string
        order:
          type: integer

    AttentionProgramCatalogSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            attentionProgramCatalog:
              type: object
              properties:
                dimensions:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttentionProgramCatalogDimensionItem'
                actionLevels:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttentionProgramCatalogLevelItem'

    AttentionProgramListItem:
      type: object
      properties:
        attentionProgramId:
          type: integer
        businessUnitId:
          type: integer
        regulationId:
          type: integer
        questionnaireApplicationId:
          type: integer
          nullable: true
        originApplication:
          $ref: '#/components/schemas/AttentionProgramOriginApplicationItem'
        year:
          type: integer
        period:
          type: string
          nullable: true
        status:
          type: string
          enum: [borrador, vigente, cerrado]
        actionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AttentionProgramOriginApplicationItem:
      type: object
      nullable: true
      properties:
        questionnaireApplicationId:
          type: integer
        folio:
          type: string
        branchOfficeName:
          type: string
          nullable: true
        status:
          type: string
          enum: [borrador, en-curso, cerrada]
        year:
          type: integer
        period:
          type: string
          nullable: true

    AttentionProgramDetail:
      allOf:
        - $ref: '#/components/schemas/AttentionProgramListItem'

    AttentionProgramCreate:
      type: object
      required: [year]
      properties:
        year:
          type: integer
          minimum: 2000
          maximum: 2100
        period:
          type: string
          maxLength: 100
        questionnaireApplicationId:
          type: integer
          minimum: 1

    AttentionProgramUpdate:
      type: object
      properties:
        period:
          type: string
          maxLength: 100
        status:
          type: string
          enum: [borrador, vigente]

    AttentionProgramSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            attentionProgram:
              $ref: '#/components/schemas/AttentionProgramDetail'

    AttentionProgramListSuccess:
      type: object
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            attentionPrograms:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttentionProgramListItem'

    ServicioRegistradoResumen:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          description: Identificador del servicio en el catálogo REPSE del tenant.
        name:
          type: string
          description: Nombre del servicio especializado registrado.

    ApiErrorServiciosRegistradosRequeridos:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Servicios registrados requeridos
        message: Debe indicar al menos un servicio del catálogo REPSE registrado.
        detail: Debe indicar al menos un servicio del catálogo REPSE.
        key: servicios-registrados-requeridos
        errorCode: CSE.VAL.SERVICIOS.001
        data: null

    ApiErrorServicioRegistradoNoEncontrado:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Servicio registrado no encontrado
        message: Uno o más servicios registrados no existen o no pertenecen al tenant actual.
        detail: Servicio registrado no encontrado.
        key: servicio-registrado-no-encontrado
        errorCode: CSE.NF.SERVICIO.001
        data: null

    ApiErrorServicioConContratosActivos:
      allOf:
        - $ref: '#/components/schemas/ApiError'
      example:
        type: error
        title: Servicio con contratos asociados
        message: No se puede eliminar el servicio mientras esté vinculado a contratos activos.
        detail: Servicio con contratos activos
        key: servicio-con-contratos-activos
        errorCode: REPSE.SVC.CONFLICT.CONTRATOS.001
        data: null

    RepseSpecializedServiceResource:
      type: object
      properties:
        repseSpecializedServiceId:
          type: integer
        repseRegistrationId:
          type: integer
        name:
          type: string
        objectDescription:
          type: string
        status:
          type: string
          enum: [active]
        repseSpecializedServiceCreatedAt:
          type: string
          format: date-time
          nullable: true
        repseSpecializedServiceUpdatedAt:
          type: string
          format: date-time
          nullable: true

    RepseSpecializedServiceDeleteSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            repseSpecializedService:
              $ref: '#/components/schemas/RepseSpecializedServiceResource'

    EmpresasContratantesListSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            empresasContratantes:
              type: object
              properties:
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/EmpresaContratante'

    EmpresaContratanteSuccess:
      type: object
      required: [type, title, message, data]
      properties:
        type:
          type: string
          enum: [success]
        title:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            empresaContratante:
              $ref: '#/components/schemas/EmpresaContratante'

    EmpresaContratanteEmbed:
      type: object
      required: [empresaContratanteId, razonSocial]
      properties:
        empresaContratanteId:
          type: integer
        razonSocial:
          type: string

    BranchOffice:
      type: object
      properties:
        branchOfficeId:
          type: integer
        businessUnitId:
          type: integer
        branchOfficeName:
