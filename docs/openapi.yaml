  /api/branch-offices/{branchOfficeId}/shift-quotas:
    get:
      summary: Listar cuotas de plantilla configuradas para una sucursal
      description: Solo sucursales dentro del scope del usuario; fuera de scope responde 404 con key sucursal-no-encontrada.
      tags: [BranchOfficeShiftQuotas]
      security:
        - bearerAuth: []
      parameters:
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: integer
        - name: branchOfficeId
          in: path
          required: true
          description: Identificador numérico de la sucursal (entero positivo).
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Cuotas configuradas con turno poblado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchOfficeShiftQuotasSuccess'
              example:
                type: success
                title: Branch Office Shift Quotas
                message: Cuotas obtenidas correctamente
                data:
                  quotas:
                    - branchOfficeShiftQuotaId: 1
                      shift:
                        shiftId: 3
                        shiftName: Nocturno
                      required: 3
                      minimum: 2
        '400':
          description: branchOfficeId no es un entero positivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Datos inválidos
                message: El parámetro branchOfficeId debe ser un entero positivo
                detail: 'Valor recibido: "a". Use un número entero mayor o igual a 1.'
                errorCode: BRCH.SQ.VAL.BRCH.001
                data: null
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Error
                message: Unauthorized access
                data: null
        '404':
          description: key sucursal-no-encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorSucursalNoEncontradaShiftQuotas'
              example:
                type: error
                title: Sucursal no encontrada
                message: Sucursal no encontrada o no disponible para esta instancia del sistema
                detail: Sucursal no encontrada o no disponible para esta instancia del sistema
                key: sucursal-no-encontrada
                errorCode: BRCH.SQ.NF.BRCH.001
                data: null
    put:
      summary: Reemplazar todas las cuotas de plantilla de una sucursal
      description: Operación replace-all transaccional. Un arreglo vacío elimina todas las cuotas del sitio.
      tags: [BranchOfficeShiftQuotas]
      security:
        - bearerAuth: []
      parameters:
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: integer
        - name: branchOfficeId
          in: path
          required: true
          description: Identificador numérico de la sucursal (entero positivo).
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchOfficeShiftQuotasReplace'
            example:
              quotas:
                - shiftId: 3
                  required: 3
                  minimum: 2
      responses:
        '200':
          description: Set completo guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchOfficeShiftQuotasSuccess'
              example:
                type: success
                title: Branch Office Shift Quotas
                message: Cuotas guardadas correctamente
                data:
                  quotas:
                    - branchOfficeShiftQuotaId: 1
                      shift:
                        shiftId: 3
                        shiftName: Nocturno
                      required: 3
                      minimum: 2
        '400':
          description: branchOfficeId inválido, validación VineJS o shiftId repetido en el payload
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiError'
                  - $ref: '#/components/schemas/ApiErrorShiftIdDuplicadoShiftQuotas'
              examples:
                branchOfficeIdInvalido:
                  summary: branchOfficeId no es entero positivo
                  value:
                    type: error
                    title: Datos inválidos
                    message: El parámetro branchOfficeId debe ser un entero positivo
                    detail: 'Valor recibido: "a". Use un número entero mayor o igual a 1.'
                    errorCode: BRCH.SQ.VAL.BRCH.001
                    data: null
                vineValidation:
                  summary: Validación VineJS
                  value:
                    type: error
                    title: Datos inválidos
                    message: The quotas.0.required field must be at least 1
                    errorCode: BRCH.SQ.VAL.001
                    data: null
                duplicateShiftId:
                  summary: shiftId repetido
                  value:
                    type: error
                    title: Turno repetido en el lote
                    message: "shiftId repetido en los items: 1, 2"
                    detail: "Los items 1, 2 repiten el mismo shiftId"
                    errorCode: BRCH.SQ.VAL.DUP.001
                    data: null
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Error
                message: Unauthorized access
                data: null
        '404':
          description: key sucursal-no-encontrada o turno-no-encontrado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorSucursalNoEncontradaShiftQuotas'
                  - $ref: '#/components/schemas/ApiErrorTurnoNoEncontradoShiftQuotas'
              examples:
                sucursalNoEncontrada:
                  summary: Sucursal fuera de scope
                  value:
                    type: error
                    title: Sucursal no encontrada
                    message: Sucursal no encontrada o no disponible para esta instancia del sistema
                    detail: Sucursal no encontrada o no disponible para esta instancia del sistema
                    key: sucursal-no-encontrada
                    errorCode: BRCH.SQ.NF.BRCH.001
                    data: null
                turnoNoEncontrado:
                  summary: Turno inexistente o de otra unidad
                  value:
                    type: error
                    title: Turno no encontrado
                    message: No se encontró el turno del item 1 (id 99999) para esta unidad
                    detail: No se encontró el turno del item 1 (id 99999) para esta unidad
                    key: turno-no-encontrado
                    errorCode: BRCH.SQ.NF.SHIFT.001
                    data: null
        '422':
          description: key cuota-invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorCuotaInvalida'
              example:
                type: error
                title: Cuota inválida
                message: "El item 1 (turno 3): el mínimo no puede superar la plantilla requerida y ambos deben ser al menos 1"
                detail: "El item 1 (turno 3): el mínimo no puede superar la plantilla requerida y ambos deben ser al menos 1"
                key: cuota-invalida
                errorCode: BRCH.SQ.VAL.QUOTA.001
                data: null

  /api/v1/attendance-stats/coverage:
    get:
      summary: Cobertura de plantilla por sitio y turno
      description: |
        Compara presentes contra cuota (requerida/mínimo) por sitio de servicio REPSE y turno del día.
        Requiere un único día (`startDay` = `endDay`) y `companyId` (empresa contratante).
        Incluye candidatos de cobertura para turnos en semáforo amarillo o rojo.
      tags: [AttendanceStats]
      security:
        - bearerAuth: []
      parameters:
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: integer
        - name: startDay
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-06-15"
        - name: endDay
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-06-15"
        - name: companyId
          in: query
          required: true
          description: ID de empresa contratante (empresaContratanteId).
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: branchOfficeIds
          in: query
          required: false
          description: CSV de IDs de sitios a incluir (subset de la empresa contratante).
          schema:
            type: string
            example: "5,7"
        - name: employeeIds
          in: query
          required: false
          schema:
            type: string
            example: "10,11"
        - name: businessUnitId
          in: query
          required: false
          schema:
            type: integer
        - name: payrollBusinessUnitId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Cobertura calculada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCoverageSuccess'
              example:
                type: success
                title: Resources
                message: Resources were found successfully
                data:
                  day: "2026-06-15"
                  sites:
                    - branchOfficeId: 5
                      name: Planta Monterrey
                      shifts:
                        - shiftId: 3
                          label: Nocturno
                          required: 10
                          min: 8
                          assigned: 9
                          present: 7
                          missing: 3
                          status: red
                          candidates:
                            - employeeId: 42
                              name: Juan Pérez
                              source: rest_same_site
                              originLeftBelowMin: false
                              originBranchOfficeId: 5
                              originBranchOfficeName: Planta Monterrey
                              loanDecision:
                                state: not_applicable
                                activeAssignmentId: null
                            - employeeId: 88
                              name: Ana López
                              source: loan_other_site
                              originLeftBelowMin: true
                              originBranchOfficeId: 12
                              originBranchOfficeName: CEDIS Guadalajara
                              loanDecision:
                                state: can_create
                                activeAssignmentId: null
        '400':
          description: Entrada inválida, rango inválido o día único requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                entradaInvalida:
                  summary: key entrada-invalida
                  value:
                    type: error
                    title: Validation error
                    message: Invalid request parameters
                    key: entrada-invalida
                    data: null
                rangoInvalido:
                  summary: key rango-invalido
                  value:
                    type: error
                    title: Validation error
                    message: Invalid date range
                    key: rango-invalido
                    data: null
                diaUnicoRequerido:
                  summary: key dia-unico-requerido
                  value:
                    type: error
                    title: Validation error
                    message: Coverage requires a single day
                    key: dia-unico-requerido
                    data: null
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Error
                message: Unauthorized access
                data: null
        '403':
          description: Scope insuficiente (key scope-insuficiente)
