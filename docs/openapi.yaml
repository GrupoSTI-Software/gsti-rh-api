                data:
                  - id: 5
                    type: terms_conditions
                    version: '2.0'
                    content: { es: '<h1>Términos v2</h1>', en: '<h1>Terms v2</h1>' }
                    status: published
                    isCurrent: true
                    publishedAt: '2026-07-05T10:00:00.000-06:00'
                    publishedBy: { userId: 12, name: 'Ana Root', email: 'ana.root@gsti.mx' }
                  - id: 1
                    type: terms_conditions
                    version: '1.0'
                    content: { es: '<h1>Términos v1</h1>', en: '<h1>Terms v1</h1>' }
                    status: published
                    isCurrent: false
                    publishedAt: '2026-07-02T00:00:00.000-06:00'
                    publishedBy: null
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: warning
                title: No autorizado
                message: El token de acceso no es válido o expiró.
                detail: Debes autenticarte nuevamente.
                key: no-autenticado
                data:
                  refreshable: true
        '403':
          description: El usuario autenticado no tiene rol `root`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Sin permiso
                message: No tienes permiso para realizar esta operación.
                key: sin-permiso
                errorCode: LGDOC.FORB.001
                data: null
        '422':
          description: El parámetro `type` es inválido o falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                type: error
                title: Documento legal
                detail: "Debes indicar el parámetro 'type' con uno de estos valores: privacy_notice, terms_conditions, biometric_consent."
                key: tipo-de-documento-invalido
                code: LGDOC.VAL.001
    post:
      summary: "[Gestión GSTI] Crear una versión en borrador"
      description: |
        Crea una versión nueva en `status='draft'` (nunca vigente). El contenido
        puede llegar con un solo idioma completo (regla de negocio 8): la
        obligatoriedad de ambos idiomas se valida al publicar, no al crear el
        borrador. El contenido se sanea por idioma en el servidor antes de
        persistir. Reservado al rol `root`.
      tags: [LegalDocuments]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, version, content]
              properties:
                type:
                  type: string
                  enum: [privacy_notice, terms_conditions, biometric_consent]
                version:
                  type: string
                  maxLength: 20
                  example: '2.0'
                content:
                  type: object
                  properties:
                    es:
                      type: string
                      example: '<h1>Términos v2</h1>'
                    en:
                      type: string
                      example: '<h1>Terms v2</h1>'
      responses:
        '201':
          description: Borrador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentAdminSuccess'
              example:
                type: success
                title: Documento legal
                message: Borrador de documento legal creado correctamente.
                data:
                  id: 6
                  type: biometric_consent
                  version: '1.0'
                  content: { es: '<p>Texto biométrico</p>', en: '' }
                  status: draft
                  isCurrent: false
                  publishedAt: null
                  publishedBy: null
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
