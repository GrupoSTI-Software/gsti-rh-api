  /api/v1/attendance-stats/coverage:
    get:
      summary: Cobertura de plantilla por sitio y turno
      description: |
        Compara presentes contra cuota (requerida/mínimo) por sitio de servicio REPSE y turno del día.
        Requiere un único día (`startDay` = `endDay`) y `companyId` (empresa contratante).
        Incluye candidatos de cobertura para turnos en semáforo amarillo o rojo.
      tags: [AttendanceStats]
      security:
        - bearerAuth: []
      parameters:
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema:
            type: integer
        - name: startDay
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-06-15"
        - name: endDay
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-06-15"
        - name: companyId
          in: query
          required: true
          description: ID de empresa contratante (empresaContratanteId).
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: branchOfficeIds
          in: query
          required: false
          description: CSV de IDs de sitios a incluir (subset de la empresa contratante).
          schema:
            type: string
            example: "5,7"
        - name: employeeIds
          in: query
          required: false
          schema:
            type: string
            example: "10,11"
        - name: businessUnitId
          in: query
          required: false
          schema:
            type: integer
        - name: payrollBusinessUnitId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Cobertura calculada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCoverageSuccess'
              example:
                type: success
                title: Resources
                message: Resources were found successfully
                data:
                  day: "2026-06-15"
                  sites:
                    - branchOfficeId: 5
                      name: Planta Monterrey
                      shifts:
                        - shiftId: 3
                          label: Nocturno
                          required: 10
                          min: 8
                          assigned: 9
                          present: 7
                          missing: 3
                          status: red
                          candidates:
                            - employeeId: 42
                              name: Juan Pérez
                              source: rest_same_site
                              originLeftBelowMin: false
                              originBranchOfficeId: 5
                              originBranchOfficeName: Planta Monterrey
                              loanDecision:
                                state: not_applicable
                                activeAssignmentId: null
                            - employeeId: 88
                              name: Ana López
                              source: loan_other_site
                              originLeftBelowMin: true
                              originBranchOfficeId: 12
                              originBranchOfficeName: CEDIS Guadalajara
                              loanDecision:
                                state: can_create
                                activeAssignmentId: null
        '400':
          description: Entrada inválida, rango inválido o día único requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                entradaInvalida:
                  summary: key entrada-invalida
                  value:
                    type: error
                    title: Validation error
                    message: Invalid request parameters
                    key: entrada-invalida
                    data: null
                rangoInvalido:
                  summary: key rango-invalido
                  value:
                    type: error
                    title: Validation error
                    message: Invalid date range
                    key: rango-invalido
                    data: null
                diaUnicoRequerido:
                  summary: key dia-unico-requerido
                  value:
                    type: error
                    title: Validation error
                    message: Coverage requires a single day
                    key: dia-unico-requerido
                    data: null
        '401':
          description: No autenticado
          content:
            application/json:
