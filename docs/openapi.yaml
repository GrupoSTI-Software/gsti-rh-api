          schema:
            type: string
            enum: [draft, published]
      responses:
        '200':
          description: Histórico de versiones del tipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentAdminListSuccess'
              example:
                type: success
