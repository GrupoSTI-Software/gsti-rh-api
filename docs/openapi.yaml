  /api/employee-badges/{employeeId}:
    get:
      summary: Datos del gafete del trabajador (foto, empresa, QR, folio si aplica)
      description: |
        Gafete universal (USRH1784686362321, R7): se genera para cualquier
        trabajador activo de la empresa del usuario, tenga o no registro
        REPSE. El folio y su vigencia viajan en `null` cuando la empresa no
        tiene registro (regla 12) — nunca es un error. Genera el código de
        verificación de forma perezosa si aún no existe (regla 6).

        Sin permiso de módulo propio (decisión de permisos, §16 del spec):
        solo requiere `auth()` + `businessScope()`.
      tags: [EmployeeBadge]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
        - name: X-Business-Unit-Id
          in: header
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          required: false
          schema: { type: string, enum: [es, en] }
          description: Traduce title/message; no altera la clave data.gafete.
        - name: employeeId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Gafete obtenido (con o sin folio REPSE, según registro de la empresa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBadgeSuccess'
              examples:
                conFolio:
                  summary: Empresa con registro REPSE
                  value:
                    type: success
                    title: Gafete del empleado
                    message: Gafete obtenido correctamente
                    data:
                      gafete:
                        empleadoId: 123
                        nombreCompleto: "Juan Pérez García"
                        fotoUrl: "https://cdn.example.com/employees/123.jpg"
                        fotoFaltante: false
                        empresa: "Seguridad Integral SA de CV"
                        logoUrl: "https://cdn.example.com/logo.png"
                        folioRepse: "REPSE-12345-2024"
                        folioVigente: true
                        vinculoVigente: true
                        urlVerificacion: "https://bo.example.com/badge-verification/abc123"
                        qrDataUrl: "data:image/png;base64,iVBORw0KGgo…"
                sinFolio:
                  summary: Empresa sin registro REPSE (R7 — no es error)
                  value:
                    type: success
                    title: Gafete del empleado
                    message: Gafete obtenido correctamente
                    data:
                      gafete:
                        empleadoId: 456
                        nombreCompleto: "Carlos Méndez Ruiz"
                        fotoUrl: null
                        fotoFaltante: true
                        empresa: "Distribuidora El Roble S. de R.L."
                        logoUrl: null
                        folioRepse: null
                        folioVigente: null
                        vinculoVigente: true
                        urlVerificacion: "https://bo.example.com/badge-verification/def456"
                        qrDataUrl: "data:image/png;base64,iVBORw0KGgo…"
        '422':
          description: "`employeeId` no es un entero positivo (key `entrada-invalida`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBadgeApiError'
              example:
                type: error
                title: Error
                message: El identificador del empleado es inválido.
                detail: El identificador del empleado es inválido.
                key: entrada-invalida
                errorCode: BDG.VAL.001
                data: null
        '401':
          description: Sin autenticación (contrato estándar de access tokens).
        '404':
          description: Trabajador inexistente, de otro tenant, eliminado o inactivo (indistinguibles).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBadgeApiError'
              example:
                type: error
                title: Gafete no encontrado
                message: El gafete no existe o el trabajador no pertenece al tenant actual.
                detail: El gafete no existe o el trabajador no pertenece al tenant actual.
                key: gafete-no-encontrado
                errorCode: BDG.NF.001
                data: null
        '500':
          description: Error no controlado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBadgeApiError'
              example:
                type: error
                title: Error
                message: Error inesperado
                errorCode: BDG.SYS.001
                data: null

