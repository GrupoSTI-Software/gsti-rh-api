<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="24" fill="#F1F5F9"/>
  <!-- Cuerpo del dispositivo -->
  <rect x="120" y="60" width="160" height="260" rx="16" fill="#CBD5E1" stroke="#94A3B8" stroke-width="3"/>
  <!-- Pantalla -->
  <rect x="136" y="80" width="128" height="90" rx="8" fill="#0F172A"/>
  <!-- Silueta de cara en pantalla -->
  <ellipse cx="200" cy="110" rx="28" ry="28" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <ellipse cx="200" cy="110" rx="16" ry="16" fill="#0EA5E9" opacity="0.6"/>
  <!-- Líneas de escaneo -->
  <line x1="145" y1="118" x2="175" y2="118" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="225" y1="118" x2="254" y2="118" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Sensor biométrico / huella -->
  <rect x="160" y="192" width="80" height="80" rx="40" fill="#94A3B8"/>
  <ellipse cx="200" cy="232" rx="28" ry="28" fill="#64748B"/>
  <!-- Líneas de huella -->
  <ellipse cx="200" cy="232" rx="8" ry="8" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="200" cy="232" rx="15" ry="15" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <ellipse cx="200" cy="232" rx="22" ry="22" fill="none" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Botón inferior -->
  <rect x="178" y="290" width="44" height="14" rx="7" fill="#94A3B8"/>
  <!-- Etiqueta placeholder -->
  <text x="200" y="355" font-family="system-ui, sans-serif" font-size="13" fill="#64748B" text-anchor="middle" font-weight="500">Modelo de dispositivo</text>
  <text x="200" y="373" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Foto próximamente</text>
</svg>
