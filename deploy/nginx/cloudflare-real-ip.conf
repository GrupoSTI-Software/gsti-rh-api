# IP real del visitante detrás de Cloudflare.
#
# El DNS de valanserh.com está en Cloudflare en modo proxy, así que el tráfico
# cruza su edge antes de llegar a nginx. Sin este archivo, $remote_addr es la IP
# del edge y todo el tráfico del país queda agrupado bajo un puñado de IPs: el
# rate limit por origen (consulta de estatus del buzón, entre otros) deja de
# distinguir usuarios y castiga a quien no falló.
#
# Instalación en el droplet:
#   sudo cp deploy/nginx/cloudflare-real-ip.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Va en conf.d porque estas directivas son de contexto http, no de server.
#
# En el server block que hace proxy_pass al 3333, la cabecera debe SOBRESCRIBIR,
# no acumular — Adonis lee el último salto de la cadena, así que un valor
# inyectado por el cliente sería justo el que tomaría:
#
#   proxy_set_header X-Forwarded-For   $remote_addr;   # no $proxy_add_x_forwarded_for
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Forwarded-Proto $scheme;
#
# Verificación: con `tail -f /var/log/nginx/access.log`, una petición desde datos
# móviles debe aparecer con la IP del operador. Si sale 104.x o 172.64-71.x, este
# archivo no está cargando.
#
# No hay riesgo de spoofing: nginx solo reescribe $remote_addr cuando el peer
# está en la lista de abajo. Quien golpee el droplet directo por IP no puede
# falsear su origen.
#
# Rangos tomados de https://www.cloudflare.com/ips-v4 y ips-v6 el 2026-08-28.
# Cambian rara vez; al regenerarlos, recargar nginx.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
